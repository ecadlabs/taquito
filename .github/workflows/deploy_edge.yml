name: Deploy Edge

# Preview builds via pkg.pr.new. Auth is the pkg-pr-new GitHub App installed on
# this repo; no registry tokens. Every in-repo PR push and main push gets
# install URLs like https://pkg.pr.new/@taquito/taquito@<sha|pr-number|main>.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs stay out: previews are built from unreviewed code.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run version-stamp
      - run: npm run build
      - run: npm run -w @taquito/taquito build:release
      # Directory mode (not tarballs) so pkg-pr-new rewrites sibling
      # @taquito/* deps to their pkg.pr.new URLs.
      - run: npm exec -- pkg-pr-new publish './packages/*'
