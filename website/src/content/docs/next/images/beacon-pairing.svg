<line x1="316" y1="428" x2="98" y2="428" stroke="#57606a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-m)"/>
<text x="206.0" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606a">invite</text>
