<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 923" width="836" height="923" role="img" aria-labelledby="t d">
<title id="t">Beacon pairing over Matrix</title><desc id="d">The dApp probes relays and logs in, shows a QR code, the wallet creates a room and invites the dApp, the invite and the join cross the two relays by federation, the wallet sends the sealed pairing response, and the dApp checks it and stores the wallet as a peer.</desc>
